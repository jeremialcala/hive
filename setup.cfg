# Mutation testing (HIG-137, Gate 3): what mutmut mutates and which tests judge each mutant. Only mutmut reads this
# file; pytest reads pytest.ini first. Run it on Linux (mutmut forks a process per mutant):
#   pip install --require-hashes -r requirements-mutation.lock && mutmut run && mutmut results
# docs/04-testing/mutation-testing.md has the scores and the mutants that survive on purpose.
[mutmut]
source_paths = src
# The modules where a failure is a security failure: who is calling, the webhook's signature, what moves a chatbot's
# state, and the per-client encryption.
only_mutate =
    src/auth/*
    src/utils/security.py
    src/controller/bot_state.py
    src/crypto/fields.py
# mutmut runs the tests from a copy of the repository in mutants/: they need these too. Some tests read the
# contracts, the matrices and the scripts of the repository, so the copy has them.
also_copy =
    shared
    pytest.ini
    CHANGELOG.md
    .ai-dlc
    docs
    deploy
    engine
    portal
pytest_add_cli_args_test_selection =
    tests/unit
    tests/security
# Each run of the tests (the stats, the clean run, every mutant) in a process forked from one that has only collected
# them. Forked from mutmut's own process, as by default, a mutant would inherit what the whole suite left behind (the
# gateway's key file, for one), and the clean run already fails on it.
process_isolation = forkserver
# And that one has collected nothing: a second pytest session in a process that already collected the suite finds
# its fixtures broken and some of its test ids changed, and every mutant would die of that, not of the tests.
forkserver_warmup = none
# These start a service in a process of their own, which inherits the variable mutmut tells its mutants apart by and
# cannot find mutmut's configuration from there. They test how each service starts, not these modules.
pytest_add_cli_args =
    --deselect=tests/unit/test_two_services.py::test_the_webhook_starts_without_what_only_the_management_api_needs
    --deselect=tests/unit/test_two_services.py::test_the_management_api_does_not_start_without_its_keys
