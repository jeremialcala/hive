# The licenses of the Python dependencies (HIG-158, Gate 4; the job «Licencias» of seguridad.yml). Decision of Jeremi
# of 2026-11-05: the permissive ones pass, and so do LGPL and MPL-2.0; GPL, AGPL, SSPL or a license Trivy does not
# know break the build. The job fails with CRITICAL (forbidden) and UNKNOWN.
#
# Each list replaces Trivy's own for its category. What is in none of them is UNKNOWN, and fails: a new license is
# looked at before it comes in. The exceptions, with their reason and their date, go in .trivyignore.yaml.
license:
  forbidden:
    - GPL-1.0
    - GPL-1.0-only
    - GPL-1.0-or-later
    - GPL-2.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0
    - GPL-3.0-only
    - GPL-3.0-or-later
    - AGPL-1.0
    - AGPL-3.0
    - AGPL-3.0-only
    - AGPL-3.0-or-later
    - SSPL-1.0
  # LGPL: Hive uses these libraries as they are, without changing them, so what LGPL asks does not reach its code.
  restricted:
    - LGPL-2.0
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0
    - LGPL-3.0-only
    - LGPL-3.0-or-later
  # Permissive, but not in Trivy's lists: cffi (MIT-0) and typing_extensions (PSF-2.0).
  permissive:
    - MIT-0
    - PSF-2.0
    - Python-2.0
