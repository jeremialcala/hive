# The static page of the management API (ADR-0026), published by hive-tunel as https://hive.higerotech.com/docs.
# Every header is set here, in the server: an add_header inside a location would drop all of these for it.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    # The tunnel talks plain HTTP to this container: a relative Location keeps the browser on https.
    absolute_redirect off;
    root /usr/share/nginx/html;
    charset utf-8;

    # Written by build.mjs, with the hashes of the page's inline scripts.
    include /etc/nginx/csp.conf;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /docs/;
    }

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/index.html =404;
    }

    location / {
        return 404;
    }
}
