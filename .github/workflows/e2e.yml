# The end-to-end test (HIG-135, Gate 3): a person writes to a chatbot and gets its answer through every piece of
# production, the images of the gateway, the engine and the portal built from this commit, with Bifröst as it is
# configured; and a person of the client signs in to the PWA, in Chromium, and sends a template (HIG-141).
# And the DAST (HIG-90): OWASP ZAP against the same stack, its own, in a job of its own, at the same time.
# On the pull requests to main, which are the releases (docs/05-deployment/releases.md); on those to develop that
# change the test itself, the portal or how production is deployed; and by hand.
#
# Bifröst's configuration and provisioning live in the private repository higerotech/bifrost: the deploy key
# BIFROST_DEPLOY_KEY reads it, and nothing else. A pull request from a fork gets no secrets, and this does not run.
name: e2e

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Toward develop, only when the test, the portal or the deployment changes; toward main and by hand, always. The two
  # jobs below always run, and do nothing when this says no: so they never stay pending as required checks.
  scope:
    name: e2e · alcance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.needed.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Whether this change needs it
        id: needed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" != "develop" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "origin/$BASE...HEAD")"
          if printf '%s\n' "$changed" | grep -qE '^(tests/e2e/|deploy/|engine/deploy/|portal/deploy/|portal/src/|\.github/workflows/e2e\.yml$|Dockerfile$|engine/Dockerfile$|portal/Dockerfile$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing of the end-to-end test or of the deployment changes: it does not run."
          fi

  e2e:
    name: e2e · del webhook a la respuesta
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN: ${{ needs.scope.outputs.run }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7

      - name: Bifröst, as it is configured
        if: env.RUN == 'true'
        uses: actions/checkout@v7
        with:
          repository: higerotech/bifrost
          ref: develop
          ssh-key: ${{ secrets.BIFROST_DEPLOY_KEY }}
          path: .e2e/bifrost
          persist-credentials: false

      - if: env.RUN == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.lock

      # The driver signs as a client would, with shared/, and drives Chromium with Playwright: its own lock, which
      # takes in the gateway's development dependencies. Chromium, with what it needs of the system.
      - if: env.RUN == 'true'
        run: |
          pip install --require-hashes -r tests/e2e/requirements.lock
          python -m playwright install --with-deps chromium

      - if: env.RUN == 'true'
        run: pytest tests/e2e -p no:cacheprovider -v
        env:
          E2E: "1"
          BIFROST_DIR: .e2e/bifrost

  # ZAP, pinned by digest in tests/e2e/test_dast.py, on a network of the stack's own with no way out: hive-api with
  # its OpenAPI contract, the webhook with its own, and the whole portal. A High fails; Medium, Low and
  # Informational stay in the report, which is attached to the run, and in the job's summary.
  dast:
    name: dast · zap
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN: ${{ needs.scope.outputs.run }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7

      - name: Bifröst, as it is configured
        if: env.RUN == 'true'
        uses: actions/checkout@v7
        with:
          repository: higerotech/bifrost
          ref: develop
          ssh-key: ${{ secrets.BIFROST_DEPLOY_KEY }}
          path: .e2e/bifrost
          persist-credentials: false

      - if: env.RUN == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.lock

      # The same lock as the end-to-end test, for its fixtures; no browser: ZAP brings what it needs.
      - if: env.RUN == 'true'
        run: pip install --require-hashes -r tests/e2e/requirements.lock

      - if: env.RUN == 'true'
        run: pytest tests/e2e/test_dast.py -p no:cacheprovider -v
        env:
          E2E: "1"
          DAST: "1"
          BIFROST_DIR: .e2e/bifrost
          DAST_REPORTS: .e2e/dast

      - name: ZAP's reports
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dast-zap
          path: .e2e/dast/
          if-no-files-found: warn
          retention-days: 30
