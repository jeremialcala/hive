# Gates de seguridad del Gate 2: fuga de secretos, dependencias vulnerables (SCA) y análisis estático (SAST).
#
# Van como PASOS QUE ROMPEN EL BUILD, no como avisos. GitHub ofrece gratis en repos públicos secret scanning,
# Dependabot y CodeQL, pero esos avisan sin detener nada, y un gate pide justo eso: algo que impida seguir.
name: Seguridad

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Una pasada semanal: una dependencia no cambia, pero lo que se SABE de ella sí. Un repo sin commits puede
    # volverse vulnerable un martes cualquiera.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secretos:
    name: Fuga de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historia completa: un secreto borrado en el commit siguiente sigue estando en el repo, y este es un
          # repositorio PÚBLICO.
          fetch-depth: 0

      - name: Instalar gitleaks
        env:
          VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Escanear la historia completa
        # `--redact` para que un hallazgo no se convierta en una segunda fuga: los logs de Actions son públicos en
        # un repo público.
        run: gitleaks detect --source . --redact --exit-code 1 --verbose

  dependencias:
    name: SCA · dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Se auditan los dos LOCKS: el de runtime es exactamente lo que instala la imagen, y el de desarrollo lo que
      # instala el CI. Nada obliga a que el de desarrollo fije las mismas versiones que el de runtime, así que
      # auditar solo uno dejaba pasar una versión vulnerable en el otro. `--strict` exige que todo se haya podido
      # auditar.
      # Los del gateway, en la raíz, los del motor de respuestas, en engine/ (ADR-0023), y los del portal, en portal/
      # (HIG-93). El de la prueba de punta a punta, en tests/e2e/, con Playwright (HIG-141). El de mutation testing, en
      # la raíz, es lo que instala el workflow `mutation` (HIG-137).
      - name: Auditar el árbol fijado
        run: |
          pip install --quiet pip-audit
          locks="requirements.lock requirements-dev.lock engine/requirements.lock engine/requirements-dev.lock"
          locks="$locks portal/requirements.lock portal/requirements-dev.lock tests/e2e/requirements.lock"
          locks="$locks requirements-mutation.lock"
          for lock in $locks; do
            pip-audit --progress-spinner off --requirement "$lock" --no-deps --strict
          done

      # Si el lock no fija los mismos paquetes que se declaran, alguien añadió o quitó una dependencia sin
      # regenerarlo: eso rompe el build. Que haya versiones más nuevas solo avisa, o cada publicación ajena lo
      # rompería.
      - name: Comprobar que los locks corresponden a lo declarado
        run: |
          pip install --quiet uv
          fallo=0
          fijados() { grep -E '^[A-Za-z0-9_.-]+==' "$1" | sort; }
          # Cada lock se resuelve desde su directorio: el de desarrollo del motor incluye su requirements.txt con -r.
          bases="requirements requirements-dev engine/requirements engine/requirements-dev"
          bases="$bases portal/requirements portal/requirements-dev tests/e2e/requirements requirements-mutation"
          for base in $bases; do
            dir=$(dirname "$base"); nombre=$(basename "$base"); tmp="/tmp/$(echo "$base" | tr / _)"
            (cd "$dir" && uv pip compile --universal --python-version 3.12 --generate-hashes --quiet "$nombre.txt" -o "$tmp.lock")
            if ! diff <(fijados "$base.lock" | cut -d= -f1) <(fijados "$tmp.lock" | cut -d= -f1) > "$tmp.nombres"; then
              echo "::error::$base.lock no fija los mismos paquetes que declara $base.txt; regenerarlo según CONTRIBUTING.md"
              cat "$tmp.nombres"
              fallo=1
            elif ! diff <(fijados "$base.lock") <(fijados "$tmp.lock") > "$tmp.versiones"; then
              echo "::warning::$base.lock tiene versiones más recientes disponibles"
              cat "$tmp.versiones"
            fi
          done
          exit $fallo

  sast:
    name: SAST · CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # En un pull request CodeQL solo informa de los hallazgos que caen en las líneas del diff. Para un gate eso
      # no sirve: el PR pasa y la rama se rompe al fusionar, cuando el análisis ya es completo. Con esto el PR y
      # el push miden lo mismo.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python
          # El SARIF también en disco, para poder decidir aquí. Sube igual a la pestaña Security, que es donde vive
          # la historia del hallazgo.
          output: sarif-python
          upload: always

      # CodeQL por sí solo NO rompe el build: deja una alerta y sigue. Este paso es el umbral: rompe con hallazgos
      # de seguridad altos o críticos fuera del código de pruebas, que es lo que pide el Gate 2; los de las pruebas
      # se informan como aviso, y el resto se queda en la pestaña Security.
      # El script tiene sus pruebas en tests/unit/test_sast_threshold.py.
      - name: Umbral de severidad sobre el SARIF
        run: python3 .ai-dlc/scripts/sast_threshold.py sarif-python

  # Los gates «container» e «IaC» del Gate 4 (HIG-157). Trivy y hadolint corren desde sus imágenes, fijadas por
  # digest como el resto de las imágenes de Hive: así no se baja ningún binario sin verificar.
  imagenes:
    name: Contenedores · ${{ matrix.imagen }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {imagen: gateway, dockerfile: Dockerfile}
          - {imagen: engine, dockerfile: engine/Dockerfile}
          - {imagen: portal, dockerfile: portal/Dockerfile}
          - {imagen: docs, dockerfile: deploy/docs/Dockerfile}
    env:
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La misma imagen que producción: el mismo Dockerfile, desde la raíz, como en build.yml.
      - name: Construir la imagen
        run: docker build -q -f "${{ matrix.dockerfile }}" -t "hive-${{ matrix.imagen }}:scan" .

      # La base de datos de vulnerabilidades, una vez al día y no en cada job.
      - id: dia
        run: echo "dia=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.dia.outputs.dia }}
          restore-keys: trivy-db-

      # Todo lo CRITICAL y HIGH, con arreglo o sin él, a la pestaña Security y al resumen del job.
      - name: Informe de la imagen
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$PWD:/src:ro" -w /src "$TRIVY" "$@"
          }
          trivy image --quiet --scanners vuln --severity CRITICAL,HIGH --ignorefile .trivyignore.yaml \
            --format sarif --output "/src/trivy-${{ matrix.imagen }}.sarif" "hive-${{ matrix.imagen }}:scan" || true
          {
            echo "### hive-${{ matrix.imagen }}: CRITICAL y HIGH"
            echo '```'
            trivy image --quiet --scanners vuln --severity CRITICAL,HIGH --ignorefile .trivyignore.yaml \
              --format table "hive-${{ matrix.imagen }}:scan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.imagen)) != ''
        with:
          sarif_file: trivy-${{ matrix.imagen }}.sarif
          category: trivy-${{ matrix.imagen }}

      # El umbral (decisión de Jeremi del 2026-11-05): rompe con un CRITICAL o un HIGH que ya tiene versión
      # corregida. Lo que no tiene arreglo se informa arriba y no bloquea. Las excepciones, en .trivyignore.yaml,
      # cada una con su motivo y su fecha de revisión.
      - name: Umbral
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/src:ro" -w /src "$TRIVY" image --quiet --scanners vuln --severity CRITICAL,HIGH \
            --ignore-unfixed --ignorefile .trivyignore.yaml --exit-code 1 "hive-${{ matrix.imagen }}:scan"

  iac:
    name: IaC · Dockerfile
    runs-on: ubuntu-latest
    env:
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      HADOLINT: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Las reglas de hadolint y lo que no aplica, en .hadolint.yaml: rompe con un aviso o un error.
      - name: hadolint
        run: |
          fallo=0
          for f in Dockerfile engine/Dockerfile portal/Dockerfile deploy/docs/Dockerfile; do
            echo "== $f"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" "$HADOLINT" hadolint - < "$f" || fallo=1
          done
          exit $fallo

      # Las configuraciones de los Dockerfile. Lo que Trivy no lee, los compose, lo prueba
      # tests/unit/test_compose_hardening.py en «gateway · test».
      - name: Trivy config
        run: |
          fallo=0
          for f in Dockerfile engine/Dockerfile portal/Dockerfile deploy/docs/Dockerfile; do
            echo "== $f"
            docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY" config --quiet --severity CRITICAL,HIGH,MEDIUM \
              --exit-code 1 "$f" || fallo=1
          done
          exit $fallo
