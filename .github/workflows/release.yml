# The images of every release, built, scanned, published and signed here, and the release that carries them
# (HIG-160, ADR-0036). Production is deployed from these images, by their digest and after `cosign verify`.
#
# With the tag vX.Y.Z, for each of the four images: build, scan (the threshold of HIG-157: if it breaks, nothing is
# published), SBOM, push to ghcr as vX.Y.Z, sign with cosign without keys (the OIDC identity of this workflow), attest
# the SBOM and the SLSA provenance, and verify the signature. Then, once the four are signed, the GitHub release, with
# the notes of the CHANGELOG, the digests and the SBOMs.
#
# In a pull request that changes this workflow, everything but what publishes: build, scan and SBOM.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagenes:
    name: Release · ${{ matrix.imagen }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The signature without keys and the attestation of the provenance.
      id-token: write
      attestations: write
    strategy:
      # A release with three images signed and one not is not a release.
      fail-fast: true
      matrix:
        include:
          - {imagen: gateway, dockerfile: Dockerfile}
          - {imagen: engine, dockerfile: engine/Dockerfile}
          - {imagen: portal, dockerfile: portal/Dockerfile}
          - {imagen: docs, dockerfile: deploy/docs/Dockerfile}
    env:
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      IMAGEN: ghcr.io/jeremialcala/hive-${{ matrix.imagen }}
      PUBLICA: ${{ github.event_name == 'push' }}
      ETIQUETA: ${{ github.event_name == 'push' && github.ref_name || format('pr-{0}', github.event.number) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag is a release only if the CHANGELOG says so: cortar_release.py wrote its section.
      - name: La etiqueta es una versión del CHANGELOG
        if: env.PUBLICA == 'true'
        run: grep -q "^## \[${ETIQUETA#v}\] - " CHANGELOG.md

      - name: Construir la imagen
        run: docker build -q -f "${{ matrix.dockerfile }}" -t "$IMAGEN:$ETIQUETA" .

      - id: dia
        run: echo "dia=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.dia.outputs.dia }}
          restore-keys: trivy-db-

      # The same threshold as «Contenedores» in seguridad.yml: before anything is published.
      - name: Umbral
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/src:ro" -w /src "$TRIVY" image --quiet --scanners vuln --severity CRITICAL,HIGH \
            --ignore-unfixed --ignorefile .trivyignore.yaml --exit-code 1 "$IMAGEN:$ETIQUETA"

      - name: SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/src" -w /src "$TRIVY" image --quiet --format cyclonedx \
            --output "/src/sbom-hive-${{ matrix.imagen }}.cdx.json" "$IMAGEN:$ETIQUETA"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLICA == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: publicar
        name: Publicar
        if: env.PUBLICA == 'true'
        run: |
          docker push --quiet "$IMAGEN:$ETIQUETA"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGEN:$ETIQUETA" | cut -d@ -f2)
          case "$digest" in sha256:*) ;; *) echo "::error::sin digest tras el push"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "hive-${{ matrix.imagen }} $IMAGEN@$digest" > "digest-hive-${{ matrix.imagen }}.txt"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.PUBLICA == 'true'
        with:
          cosign-release: v3.1.4

      # Without keys: the certificate says this workflow, of this repository, at this tag, signed it.
      - name: Firmar y atestar el SBOM
        if: env.PUBLICA == 'true'
        env:
          DIGEST: ${{ steps.publicar.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGEN@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate "sbom-hive-${{ matrix.imagen }}.cdx.json" "$IMAGEN@$DIGEST"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLICA == 'true'
        with:
          subject-name: ${{ env.IMAGEN }}
          subject-digest: ${{ steps.publicar.outputs.digest }}
          push-to-registry: true

      # What the server will check before it brings the image up (ADR-0036, HIG-20), checked here first.
      - name: Verificar la firma
        if: env.PUBLICA == 'true'
        env:
          DIGEST: ${{ steps.publicar.outputs.digest }}
        run: |
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            "$IMAGEN@$DIGEST" > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.imagen }}
          path: |
            sbom-hive-${{ matrix.imagen }}.cdx.json
            digest-hive-${{ matrix.imagen }}.txt
          if-no-files-found: warn

  publicar:
    name: Release · GitHub
    needs: imagenes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true

      # The notes of the CHANGELOG, and under them the digest of each image and how to verify it.
      - name: Notas
        run: |
          version="${GITHUB_REF_NAME#v}"
          python .ai-dlc/scripts/cortar_release.py "$version" --notas > notas.md
          {
            echo
            echo "## Imágenes"
            echo
            echo "Firmadas con cosign sin claves, con su SBOM y su procedencia atestados (ADR-0036):"
            echo
            echo '```'
            cat digest-hive-*.txt
            echo '```'
            echo
            echo "Para verificar una:"
            echo
            echo '```sh'
            echo "cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF} \\"
            echo "  ghcr.io/jeremialcala/hive-gateway@<digest>"
            echo '```'
          } >> notas.md

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          titulo="Hive ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$titulo" --notes-file notas.md
            gh release upload "$GITHUB_REF_NAME" sbom-hive-*.cdx.json digest-hive-*.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$titulo" --notes-file notas.md \
              sbom-hive-*.cdx.json digest-hive-*.txt
          fi
