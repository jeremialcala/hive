# Publishes the image to GHCR for continuous deployment (receiver: github.com/higerotech/despliegue-continuo).
#
# The NAME of this workflow is a contract: the receiver only deploys when a workflow_run called exactly
# `build` finishes successfully on `main`. Renaming it stops deployments silently.
#
# `type=sha` produces `sha-<7 hex>`, the tag the receiver expects. Changing that format would make every
# deployment fail with `manifest unknown`.
name: build

on:
  push:
    branches: [main]
    # A push to main that only changes the response engine does not redeploy the gateway: its image is the same.
    # The engine is published by `build-engine` (ADR-0023).
    paths-ignore:
      - "engine/**"
      - ".github/workflows/engine.yml"
      - ".github/workflows/build-engine.yml"
      # Nor one that only changes the portal (HIG-93), which has its own image.
      - "portal/**"
      - ".github/workflows/portal.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The client of the key service is tested against a real one, in development mode: it starts unsealed and
    # with a known root token, which the tests use to set it up like the one in production.
    services:
      openbao:
        image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
        env:
          BAO_DEV_ROOT_TOKEN_ID: dev-root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
      # Publishing is tested against a real broker, the same version as the one in production.
      rabbitmq:
        image: rabbitmq:4.3.5-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        ports:
          - 5672:5672
        # The job waits for this one: it takes a few seconds to accept connections.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # From the lock and with hashes: the tests run against exactly what was pinned.
      - run: pip install --require-hashes -r requirements-dev.lock

      # Branch coverage below what Gate 2 asks for breaks the build.
      - run: pytest --cov=src --cov=shared --cov-branch --cov-fail-under=80
        env:
          OPENBAO_TEST_ADDR: http://127.0.0.1:8200
          OPENBAO_TEST_TOKEN: dev-root
          # Here the integration tests must run: without this they would be skipped without a word.
          OPENBAO_TEST_REQUIRED: "1"
          RABBITMQ_TEST_ADDR: 127.0.0.1:5672
          RABBITMQ_TEST_REQUIRED: "1"

  build:
    # Nothing is published, and so nothing is deployed, unless the tests pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # By name, not by the repository's: the gateway and the engine are two images of one repository (ADR-0024).
          images: ghcr.io/${{ github.repository_owner }}/hive-gateway
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# The deployment is NOT triggered from here. When this workflow completes, GitHub sends workflow_run to the
# server's webhook, which checks the signature, the branch and the conclusion, and deploys the sha-xxxxxxx tag.
