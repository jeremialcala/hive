  /oauth/token:
    post:
      description: A machine credential authenticates with an assertion its key signed (client_credentials, RFC
        7523, section 2.2, ADR-0025). The BFF of the PWA exchanges the ID token of a person (token-exchange, RFC
        8693, ADR-0029), and the token says the person and their role in their client. Either way, an access token
        the gateway signs, for every other route.
      operationId: oauth_token_oauth_token_post
      parameters:
      - description: 'A DPoP proof (RFC 9449) for POST and this URL, without ath: signed with the same key as the
          assertion, or, in an exchange, with the BFF''s own key.'
        in: header
        name: DPoP
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              description: client_credentials takes client_assertion_type and client_assertion; token-exchange (RFC
                8693, ADR-0029), subject_token and subject_token_type.
              properties:
                client_assertion:
                  description: A JWT the client signs (ES256, with the kid of its registered key; iss and sub, the
                    client; aud, the gateway; 60 seconds at most; good once), inside a JWE for a key of GET /gateway/keys
                    (RSA-OAEP-256, A256CBC-HS512, cty JWT).
                  type: string
                client_assertion_type:
                  enum:
                  - urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                  type: string
                grant_type:
                  enum:
                  - client_credentials
                  - urn:ietf:params:oauth:grant-type:token-exchange
                  type: string
                hive_client:
                  description: 'token-exchange: the client the person enters, only needed for a person of more than
                    one.'
                  format: uuid
                  type: string
                requested_token_type:
                  enum:
                  - urn:ietf:params:oauth:token-type:access_token
                  type: string
                subject_token:
                  description: 'token-exchange: the ID token Zitadel gave the person, for the BFF, with mfa in its
                    amr.'
                  type: string
                subject_token_type:
                  enum:
                  - urn:ietf:params:oauth:token-type:id_token
                  type: string
              required:
              - grant_type
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                  issued_token_type:
                    enum:
                    - urn:ietf:params:oauth:token-type:access_token
                    type: string
                  token_type:
                    enum:
                    - DPoP
                    type: string
                required:
                - access_token
                - token_type
                - expires_in
                type: object
          description: An access token, good for 10 minutes. An exchange also says issued_token_type.
        '400':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                required:
                - error
                type: object
          description: 'invalid_request, unsupported_grant_type, or invalid_dpop_proof: the DPoP header is missing,
            is not good, or is not signed by the key that signed the assertion. In an exchange, invalid_grant: the
            ID token is not good, has no second factor, or its person is not in Hive, is blocked or removed, or
            their client is not active, whatever the reason; and invalid_target: the person is of more than one
            client, and hive_client does not say which.'
        '401':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                required:
                - error
                type: object
          description: 'invalid_client: the assertion is not good, whatever the reason.'
        '429':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                required:
                - error
                type: object
          description: 'temporarily_unavailable: too many requests from this origin, too many rejected assertions
            from it, or too many tokens for this key in the last hour (ADR-0028). Retry-After says in how many seconds
            to ask again.'
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
        '503':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                required:
                - error
                type: object
          description: 'temporarily_unavailable: in an exchange, the keys of the IdP could not be read.'
      summary: An access token, for a client that proves who it is or for a person of a client
      tags:
      - OAuth
