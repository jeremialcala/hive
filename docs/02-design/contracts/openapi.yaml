# Contrato OpenAPI de un servicio del gateway (fase 02-design). Refleja la API tal como está construida.
# Generado con .ai-dlc/scripts/gen_openapi.py: regenerar, no editar a mano.
# Sin valores por defecto ni ejemplos: en el código son aleatorios y cambian en cada arranque.
# Declara la autenticación (OAuth2, client_credentials en /oauth/token, ADR-0025). La firma X-Hub-Signature-256
# del webhook no aparece: se comprueba en una dependencia que OpenAPI no ve.
components:
  schemas:
    ActionParameterRequest:
      additionalProperties: false
      properties:
        description:
          maxLength: 1000
          title: Description
          type: string
        enum:
          items:
            maxLength: 500
            minLength: 1
            type: string
          maxItems: 50
          title: Enum
          type: array
        name:
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
          title: Name
          type: string
        required:
          title: Required
          type: boolean
        type:
          enum:
          - string
          - number
          - integer
          - boolean
          - object
          - array
          title: Type
          type: string
      required:
      - name
      title: ActionParameterRequest
      type: object
    ActionRequest:
      additionalProperties: false
      description: 'What the bot can do for an intent: call an API (api_call, with its apiCall) or hand the conversation
        over to a

        person (handoff, without one).'
      properties:
        apiCall:
          anyOf:
          - $ref: '#/components/schemas/ApiCallRequest'
          - type: 'null'
        description:
          maxLength: 1000
          minLength: 1
          title: Description
          type: string
        name:
          pattern: ^[A-Za-z0-9_-]{1,64}$
          title: Name
          type: string
        parameters:
          items:
            $ref: '#/components/schemas/ActionParameterRequest'
          maxItems: 20
          title: Parameters
          type: array
        type:
          enum:
          - api_call
          - handoff
          title: Type
          type: string
      required:
      - name
      - description
      title: ActionRequest
      type: object
    ApiCallRequest:
      additionalProperties: false
      properties:
        authRef:
          pattern: ^[A-Za-z0-9_.-]{0,100}$
          title: Authref
          type: string
        authType:
          enum:
          - none
          - bearer
          - api_key
          - basic
          title: Authtype
          type: string
        body:
          additionalProperties: true
          title: Body
          type: object
        headers:
          additionalProperties:
            type: string
          title: Headers
          type: object
        method:
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          title: Method
          type: string
        query:
          additionalProperties:
            type: string
          title: Query
          type: object
        timeout:
          maximum: 30.0
          minimum: 1.0
          title: Timeout
          type: integer
        url:
          maxLength: 2048
          title: Url
          type: string
      required:
      - url
      title: ApiCallRequest
      type: object
    Body:
      additionalProperties: false
      properties:
        example:
          anyOf:
          - $ref: '#/components/schemas/BodyExample'
          - type: 'null'
        text:
          maxLength: 1024
          minLength: 1
          title: Text
          type: string
        type:
          const: BODY
          title: Type
          type: string
      required:
      - type
      - text
      title: Body
      type: object
    BodyExample:
      additionalProperties: false
      properties:
        body_text:
          items:
            items:
              type: string
            type: array
          maxItems: 1
          minItems: 1
          title: Body Text
          type: array
      required:
      - body_text
      title: BodyExample
      type: object
    BotCredentialsRequest:
      additionalProperties: false
      description: 'The Meta credentials of a chatbot. Each one that is sent replaces the stored one; the ones left
        out stay

        as they are. They are stored encrypted and no endpoint returns them.'
      properties:
        appSecret:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Appsecret
        facebookToken:
          anyOf:
          - maxLength: 2048
            minLength: 1
            type: string
          - type: 'null'
          title: Facebooktoken
        wabaId:
          anyOf:
          - pattern: ^[0-9]{5,25}$
            type: string
          - type: 'null'
          title: Wabaid
        whatsappToken:
          anyOf:
          - maxLength: 2048
            minLength: 1
            type: string
          - type: 'null'
          title: Whatsapptoken
      title: BotCredentialsRequest
      type: object
    BotResponse:
      properties:
        code:
          title: Code
          type: integer
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - {}
          - type: 'null'
          title: Data
        message:
          title: Message
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      title: BotResponse
      type: object
    Buttons:
      additionalProperties: false
      properties:
        buttons:
          items:
            discriminator:
              mapping:
                PHONE_NUMBER: '#/components/schemas/PhoneButton'
                QUICK_REPLY: '#/components/schemas/QuickReply'
                URL: '#/components/schemas/UrlButton'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/QuickReply'
            - $ref: '#/components/schemas/UrlButton'
            - $ref: '#/components/schemas/PhoneButton'
          maxItems: 10
          minItems: 1
          title: Buttons
          type: array
        type:
          const: BUTTONS
          title: Type
          type: string
      required:
      - type
      - buttons
      title: Buttons
      type: object
    ChatbotPhoneRequest:
      properties:
        environment:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
        phoneId:
          title: Phoneid
          type: string
        phoneNumber:
          title: Phonenumber
          type: string
      title: ChatbotPhoneRequest
      type: object
    ChatbotRequest:
      additionalProperties: false
      description: 'A new chatbot: for now, its persona. Its numbers, rules and intents are added afterwards.'
      properties:
        description:
          maxLength: 2000
          title: Description
          type: string
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        role:
          maxLength: 100
          minLength: 1
          title: Role
          type: string
        tone:
          maxLength: 100
          minLength: 1
          title: Tone
          type: string
      required:
      - name
      - role
      - description
      - tone
      title: ChatbotRequest
      type: object
    ClientRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 64
          minLength: 3
          pattern: ^[A-Za-z0-9][A-Za-z0-9 ._-]*$
          title: Name
          type: string
        signingKey:
          additionalProperties: true
          title: Signingkey
          type: object
      required:
      - signingKey
      - name
      title: ClientRequest
      type: object
    ConsentRequest:
      additionalProperties: false
      description: That a contact agreed to get the client's messages of these categories, when and where (RF31).
      properties:
        categories:
          items:
            enum:
            - MARKETING
            - UTILITY
            type: string
          maxItems: 2
          minItems: 1
          title: Categories
          type: array
        grantedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Grantedat
        source:
          maxLength: 200
          minLength: 1
          title: Source
          type: string
      required:
      - categories
      - source
      title: ConsentRequest
      type: object
    ContactSearchRequest:
      additionalProperties: false
      description: 'Who to look for among the contacts of a client: a WhatsApp number or a Messenger id, one of
        the two.

        It travels in the body, not in the address: an address ends up in logs along the way.'
      properties:
        fbId:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          title: Fbid
        waId:
          anyOf:
          - maxLength: 32
            minLength: 1
            pattern: ^[0-9+() .-]*[0-9][0-9+() .-]*$
            type: string
          - type: 'null'
          title: Waid
      title: ContactSearchRequest
      type: object
    Footer:
      additionalProperties: false
      properties:
        text:
          maxLength: 60
          minLength: 1
          title: Text
          type: string
        type:
          const: FOOTER
          title: Type
          type: string
      required:
      - type
      - text
      title: Footer
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Header:
      additionalProperties: false
      properties:
        format:
          const: TEXT
          title: Format
          type: string
        text:
          maxLength: 60
          minLength: 1
          title: Text
          type: string
        type:
          const: HEADER
          title: Type
          type: string
      required:
      - type
      - format
      - text
      title: Header
      type: object
    IntentRequest:
      additionalProperties: false
      properties:
        actions:
          items:
            $ref: '#/components/schemas/ActionRequest'
          maxItems: 10
          title: Actions
          type: array
        description:
          maxLength: 1000
          minLength: 1
          title: Description
          type: string
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        samplePhrases:
          items:
            maxLength: 500
            minLength: 1
            type: string
          maxItems: 50
          title: Samplephrases
          type: array
      required:
      - name
      - description
      title: IntentRequest
      type: object
    OutboundMessageRequest:
      additionalProperties: false
      description: A text inside the window of 24 hours, or an approved template, inside or outside it.
      properties:
        template:
          anyOf:
          - $ref: '#/components/schemas/TemplateRequest'
          - type: 'null'
        text:
          anyOf:
          - maxLength: 4096
            minLength: 1
            type: string
          - type: 'null'
          title: Text
        type:
          enum:
          - text
          - template
          title: Type
          type: string
      required:
      - type
      title: OutboundMessageRequest
      type: object
    OwnedKeyRequest:
      additionalProperties: false
      properties:
        proof:
          maxLength: 8192
          minLength: 1
          title: Proof
          type: string
        signingKey:
          additionalProperties: true
          title: Signingkey
          type: object
      required:
      - signingKey
      - proof
      title: OwnedKeyRequest
      type: object
    PersonChangeRequest:
      additionalProperties: false
      description: 'Another role, or another state: at least one of the two.'
      properties:
        role:
          anyOf:
          - enum:
            - cliente-admin
            - cliente-analista
            type: string
          - type: 'null'
          title: Role
        status:
          anyOf:
          - enum:
            - active
            - blocked
            type: string
          - type: 'null'
          title: Status
      title: PersonChangeRequest
      type: object
    PersonInviteRequest:
      additionalProperties: false
      description: 'The email and the role of the person. The names only go to Zitadel, for its invitation: Hive
        keeps none.'
      properties:
        email:
          maxLength: 254
          pattern: ^[^@\s]{1,64}@[^@\s]{1,253}\.[^@\s]{2,63}$
          title: Email
          type: string
        familyName:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Familyname
        givenName:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Givenname
        role:
          enum:
          - cliente-admin
          - cliente-analista
          title: Role
          type: string
      required:
      - email
      - role
      title: PersonInviteRequest
      type: object
    PersonaRequest:
      additionalProperties: false
      properties:
        description:
          maxLength: 2000
          title: Description
          type: string
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        role:
          maxLength: 100
          minLength: 1
          title: Role
          type: string
        tone:
          maxLength: 100
          minLength: 1
          title: Tone
          type: string
      required:
      - name
      - role
      - description
      - tone
      title: PersonaRequest
      type: object
    PhoneButton:
      additionalProperties: false
      properties:
        phone_number:
          pattern: ^\+?[0-9]{6,20}$
          title: Phone Number
          type: string
        text:
          maxLength: 25
          minLength: 1
          title: Text
          type: string
        type:
          const: PHONE_NUMBER
          title: Type
          type: string
      required:
      - type
      - text
      - phone_number
      title: PhoneButton
      type: object
    QuickReply:
      additionalProperties: false
      properties:
        text:
          maxLength: 25
          minLength: 1
          title: Text
          type: string
        type:
          const: QUICK_REPLY
          title: Type
          type: string
      required:
      - type
      - text
      title: QuickReply
      type: object
    RatingRequest:
      additionalProperties: false
      description: 'What a person of the client thinks of an answer of the bot (RF28, HIG-111): good (`up`) or bad
        (`down`), and

        why if they want. The answer is said by Meta''s id of what was sent, which the conversation gives.'
      properties:
        comment:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Comment
        messageId:
          maxLength: 200
          minLength: 1
          title: Messageid
          type: string
        score:
          enum:
          - up
          - down
          title: Score
          type: string
      required:
      - messageId
      - score
      title: RatingRequest
      type: object
    ResponseData:
      properties:
        code:
          title: Code
          type: integer
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - {}
          - type: 'null'
          title: Data
        message:
          title: Message
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      title: ResponseData
      type: object
    RuleRequest:
      additionalProperties: false
      description: One rule, changed.
      properties:
        rule:
          maxLength: 1000
          minLength: 1
          title: Rule
          type: string
      required:
      - rule
      title: RuleRequest
      type: object
    RulesRequest:
      additionalProperties: false
      properties:
        rules:
          items:
            maxLength: 1000
            minLength: 1
            type: string
          maxItems: 50
          minItems: 1
          title: Rules
          type: array
      required:
      - rules
      title: RulesRequest
      type: object
    ServiceKeyRequest:
      additionalProperties: false
      properties:
        signingKey:
          additionalProperties: true
          title: Signingkey
          type: object
        worker:
          $ref: '#/components/schemas/Worker'
      required:
      - signingKey
      - worker
      title: ServiceKeyRequest
      type: object
    SigningKeyRequest:
      additionalProperties: false
      properties:
        signingKey:
          additionalProperties: true
          title: Signingkey
          type: object
      required:
      - signingKey
      title: SigningKeyRequest
      type: object
    TemplateCreateRequest:
      additionalProperties: false
      properties:
        category:
          enum:
          - MARKETING
          - UTILITY
          title: Category
          type: string
        components:
          items:
            discriminator:
              mapping:
                BODY: '#/components/schemas/Body'
                BUTTONS: '#/components/schemas/Buttons'
                FOOTER: '#/components/schemas/Footer'
                HEADER: '#/components/schemas/Header'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/Body'
            - $ref: '#/components/schemas/Header'
            - $ref: '#/components/schemas/Footer'
            - $ref: '#/components/schemas/Buttons'
          maxItems: 4
          minItems: 1
          title: Components
          type: array
        language:
          maxLength: 15
          minLength: 2
          pattern: ^[a-z]{2,3}(_[A-Za-z0-9]{2,8})?$
          title: Language
          type: string
        name:
          maxLength: 512
          minLength: 1
          pattern: ^[a-z0-9_]+$
          title: Name
          type: string
      required:
      - components
      - name
      - language
      - category
      title: TemplateCreateRequest
      type: object
    TemplateEditRequest:
      additionalProperties: false
      description: Meta replaces every component of the template, and an approved one does not change its category.
      properties:
        components:
          items:
            discriminator:
              mapping:
                BODY: '#/components/schemas/Body'
                BUTTONS: '#/components/schemas/Buttons'
                FOOTER: '#/components/schemas/Footer'
                HEADER: '#/components/schemas/Header'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/Body'
            - $ref: '#/components/schemas/Header'
            - $ref: '#/components/schemas/Footer'
            - $ref: '#/components/schemas/Buttons'
          maxItems: 4
          minItems: 1
          title: Components
          type: array
      required:
      - components
      title: TemplateEditRequest
      type: object
    TemplateRequest:
      additionalProperties: false
      properties:
        language:
          maxLength: 15
          minLength: 2
          pattern: ^[a-z]{2,3}(_[A-Za-z0-9]{2,8})?$
          title: Language
          type: string
        name:
          maxLength: 512
          minLength: 1
          pattern: ^[a-z0-9_]+$
          title: Name
          type: string
        parameters:
          items:
            type: string
          maxItems: 20
          title: Parameters
          type: array
      required:
      - name
      - language
      title: TemplateRequest
      type: object
    UrlButton:
      additionalProperties: false
      properties:
        text:
          maxLength: 25
          minLength: 1
          title: Text
          type: string
        type:
          const: URL
          title: Type
          type: string
        url:
          maxLength: 2000
          minLength: 9
          pattern: ^https://[^\s]+$
          title: Url
          type: string
      required:
      - type
      - text
      - url
      title: UrlButton
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    Worker:
      description: The workers of the response engine that call this service, each with keys of its own (ADR-0022).
      enum:
      - classifier
      - coordinator
      - link
      - responder
      - evaluator
      - notifier
      title: Worker
      type: string
  securitySchemes:
    OAuth2:
      description: 'An access token from POST /oauth/token (ADR-0025): a JWT the gateway signs (ES256, typ at+jwt),
        sent as `Authorization: DPoP <token>`. It lasts 10 minutes and is good for every request in them. The client
        authenticates at /oauth/token with a signed assertion (RFC 7523), not with a secret. The token is bound
        to the client''s key (RFC 9449, ADR-0033): every request, POST /oauth/token too, carries a `DPoP` header,
        a proof that key signs for that method and URL, good once and for 60 seconds, with the hash of the token
        it goes with.'
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: /oauth/token
      type: oauth2
info:
  description: "\nThe management API of Hive, the gateway between Meta (Messenger and WhatsApp) and the response\
    \ engine of each\nchatbot. Each client manages its own chatbots through it and reaches nothing of anybody else's.\
    \ What Meta calls is\nanother service, the webhook, which runs apart from this one.\n\n### Getting a token\n\
    \nEvery route but the health check and /oauth/token asks for an access token in `Authorization: DPoP`, and beside\n\
    it a DPoP proof (RFC 9449) in the `DPoP` header: the token is bound to the key of the client.\n\n* /oauth/token:\
    \ @POST, as a form (OAuth 2.0 client credentials, RFC 6749 section 4.4). The client proves who it is\n  with\
    \ an assertion (RFC 7523): a JWT it signs with a key it has registered (`ES256`, with the key's `kid`), with\n\
    \  its own identifier as `iss` and `sub` and the audience of /gateway/keys as `aud`, encrypted to a public key\
    \ of\n  /gateway/keys (`RSA-OAEP-256` with `A256CBC-HS512`). An assertion is good once and for 60 seconds at\
    \ most.\n* Every request, the one to /oauth/token too, carries a new DPoP proof: a JWT signed with the same\
    \ key as the\n  assertion (`typ` `dpop+jwt`, `ES256`, the public key as `jwk` in its header), with a new `jti`,\
    \ the method as\n  `htm`, the URL without query as `htu`, `iat` and, beside an access token, its SHA-256 as\
    \ `ath`. A proof is good\n  once and for 60 seconds.\n* The access token lasts 10 minutes and is good for every\
    \ request in them. Ask for a new one shortly before it\n  expires, not for every request: each key gets a bounded\
    \ number of tokens an hour, and an address that asks too\n  often, or keeps sending assertions that are not\
    \ good, gets a 429 with `Retry-After`.\n* Every other route but the health check counts the requests of each\
    \ credential, a key or a person: 300 a minute,\n  and more get the same 429 with `Retry-After`. An address that\
    \ got a 401 or a 403 30 times in ten minutes gets it\n  too, until the first of them is ten minutes old.\n\n\
    ### A client and its chatbots\n\n* /bot: @POST creates a chatbot.\n* /bot/{bot_id}: @DELETE deletes it with\
    \ everything stored for it.\n* /chat/{bot_id}/info: @GET what is stored of the chatbot, and which Meta credentials\
    \ are loaded.\n* /chat/{bot_id}/credentials: @PUT loads or rotates its Meta credentials. They are never returned.\n\
    * /chat/{bot_id}/phones: @POST adds a WhatsApp number, @GET lists them. `?environment=` gives the last one of\
    \ it.\n* /chat/{bot_id}/rules: @POST adds rules, @GET the persona of the chatbot and its rules, as data.\n*\
    \ /chat/{bot_id}/intents: @POST and @GET; /chat/{bot_id}/intents/{intent_id} takes @GET, @PUT and @DELETE.\n\
    * /chat/{bot_id}/tools: @GET the actions of its intents as tool definitions for the model.\n* /chat/{bot_id}/contacts:\
    \ @GET who wrote to it, a page at a time; /chat/{bot_id}/contacts/{contact_id} exports\n  one with @GET and\
    \ deletes it with @DELETE.\n* /contacts/search: @POST finds a person in every chatbot of the client, by number\
    \ or by Messenger id.\n* /keys: @GET the keys of the caller, @POST adds one to rotate; /keys/{kid} removes one\
    \ with @DELETE.\n\n### The response engine\n\nEach worker of the engine holds its own key for each client, and\
    \ the key says which routes it reaches: the\nnotifier, the Meta tokens; the coordinator, the rules, the tools\
    \ and the last turns of a conversation; the\nclassifier, the responder and the evaluator, the rules; the link,\
    \ the tools. All of them read /gateway/keys.\n\n* /chat/{bot_id}/tokens: @GET the Meta tokens of a chatbot.\
    \ Only for the notifier, with the key it holds for the\n  client that owns the chatbot.\n* /chat/{bot_id}/contacts/{contact_id}/turns:\
    \ @GET the last 10 turns of a conversation, for the coordinator.\n\n### The operator\n\n* /clients: @POST registers\
    \ a client, @GET lists them; /clients/{client_id} takes one off with @DELETE.\n* /clients/{client_id}/keys:\
    \ the keys a client signs with; /clients/{client_id}/service-keys, the keys each\n  worker of the response engine\
    \ signs with for that client, with the worker that signs with each.\n\n### Any caller\n\n* /gateway/keys: @GET\
    \ the audience and the public keys tokens are encrypted to.\n* /health: @GET liveness, without a token.\n"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  summary: 'The chatbots of a Hive client: their Meta credentials, numbers, rules, intents and contacts'
  title: Hive management API
  version: 0.12.0+develop
openapi: 3.1.0
paths:
  /bot:
    post:
      operationId: create_chatbot_bot_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotRequest'
        required: true
      responses:
        '200':
          content:
