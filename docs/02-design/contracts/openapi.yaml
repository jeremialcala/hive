  /oauth/token:
    post:
      description: The client authenticates with an assertion its key signed, as in RFC 7523, section 2.2 (ADR-0025),
        and gets an access token the gateway signs, for every other route.
      operationId: oauth_token_oauth_token_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                client_assertion:
                  description: A JWT the client signs (ES256, with the kid of its registered key; iss and sub, the
                    client; aud, the gateway; 60 seconds at most; good once), inside a JWE for a key of GET /gateway/keys
                    (RSA-OAEP-256, A256CBC-HS512, cty JWT).
                  type: string
                client_assertion_type:
                  enum:
                  - urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                  type: string
                grant_type:
                  enum:
                  - client_credentials
                  type: string
              required:
              - grant_type
              - client_assertion_type
              - client_assertion
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                  token_type:
                    enum:
                    - Bearer
                    type: string
                required:
                - access_token
                - token_type
                - expires_in
                type: object
          description: An access token, good for 10 minutes.
        '400':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                required:
                - error
                type: object
          description: invalid_request or unsupported_grant_type.
        '401':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                required:
                - error
                type: object
          description: 'invalid_client: the assertion is not good, whatever the reason.'
      summary: An access token for a client that proves who it is (OAuth 2.0 client_credentials, RFC 7523)
      tags:
      - OAuth
