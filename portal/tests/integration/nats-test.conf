# A NATS JetStream for the integration tests of hive-portal, like Bifröst (repository bifrost, nats/bifrost.conf):
# the portal's user with the same subjects, the bucket `sesiones` and nothing else. No TLS nor encrypted store: they
# are the server's business, not the client's.
#
#   docker run --rm -p 127.0.0.1:24222:4222 -v "$PWD/tests/integration/nats-test.conf:/etc/nats/test.conf:ro" \
#       nats:2.14.8-alpine -c /etc/nats/test.conf

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: "/tmp/jetstream"
  sync_interval: always
}

authorization {
  users: [
    # The tests make the bucket with this one, as aprovisionar.sh does in Bifröst.
    { user: admin, password: test }
    # What Bifröst gives the portal.
    { user: portal, password: test, permissions: {
        publish: { allow: [
          "$JS.API.INFO",
          "$JS.API.STREAM.INFO.KV_sesiones",
          "$JS.API.DIRECT.GET.KV_sesiones.>",
          "$JS.API.STREAM.MSG.GET.KV_sesiones",
          "$KV.sesiones.>"
        ] }
        subscribe: { allow: ["_INBOX_portal.>"] }
    } }
  ]
}
